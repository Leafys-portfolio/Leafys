<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="theme-color" content="#09090c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta property="og:type" content="profile"><meta property="og:title" id="ogt" content="Discord portfolio"><meta property="og:description" id="ogd" content="Servers, roles and live member counts."><meta property="og:image" id="ogi" content="">
<meta name="description" content="Discord moderator portfolio — servers, roles and live member counts.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23fff'/></svg>">
<style>
  :root{--accent:#fff;--accent2:#a1a1aa;--bg:#0a0a0a;--surface:#111113;--text:#f4f4f5;--muted:#8b8b95;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--r:4px;--cta:#f5d547;--font:'Inter';--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--font),Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  body.pattern:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 100%);opacity:.5}
  body.glow:after{content:'';position:fixed;left:50%;top:-20vh;width:90vw;height:70vh;transform:translateX(-50%);z-index:0;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);filter:blur(30px)}
  .page{position:relative;z-index:1}

  /* loader */
  #loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
  #loader.hide{opacity:0;visibility:hidden}
  #loader .in{text-align:center}
  #loader .t{font-weight:600;letter-spacing:.3px;font-size:15px;color:var(--muted)}
  #loader .bar{width:160px;height:2px;background:var(--line);border-radius:2px;margin:14px auto 0;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:ld 1s infinite ease-in-out}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

  /* nav */
  nav{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s;background:linear-gradient(var(--bg),transparent)}
  nav.hide{transform:translateY(-120%)}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em}
  nav .brand img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface)}
  nav .links{display:flex;gap:6px}
  nav a.l{padding:8px 14px;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:color .15s}
  nav a.l:hover{color:var(--text)}
  nav a.cta{justify-self:end;padding:14px 22px;border:1px solid var(--line2);font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:8px;transition:background .2s,border-color .2s}
  nav a.cta:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35)}
  nav a.cta svg{width:14px;height:14px;fill:currentColor}
  @media(max-width:760px){nav{grid-template-columns:1fr auto;padding:16px 18px}nav .links{display:none}nav .brand span{display:none}nav a.cta{padding:12px 16px}}

  /* hero */
  .hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:110px 32px 48px;overflow:hidden}
  canvas#orb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,100svh);height:min(100vw,100svh);pointer-events:none;z-index:0}
  .hero .in{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:end;max-width:1600px;width:100%;margin:0 auto}
  .orbwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
  .avwrap{position:relative;display:inline-block}
  .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--surface);border:1px solid var(--line2);box-shadow:0 0 0 10px rgba(0,0,0,.35),0 30px 80px rgba(0,0,0,.7)}
  .status{position:absolute;right:2px;bottom:2px;width:20px;height:20px;border-radius:50%;background:#5b5b66;border:4px solid var(--bg)}
  .status.online{background:#23a55a}.status.idle{background:#f0b232}.status.dnd{background:#f23f43}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px}
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:#23a55a;box-shadow:0 0 10px #23a55a}
  h1{margin:0;font-size:clamp(40px,5.6vw,76px);line-height:1.02;letter-spacing:-.04em;font-weight:700;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--text) 55%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin:12px 0 0;color:var(--muted);font:500 14px/1 var(--mono);letter-spacing:.04em}
  .bio{margin:28px 0 0;max-width:520px;color:color-mix(in srgb,var(--text) 65%,var(--muted));font-size:clamp(16px,1.6vw,20px);line-height:1.5}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:13.5px}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:16px;text-align:right}
  .right .note{color:var(--muted);font-size:14px}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:18px 26px;font:600 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;transition:transform .15s,filter .15s,background .15s,border-color .15s}
  .btn.pri{background:var(--cta);color:#111}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn.ghost{border:1px solid var(--line2);color:var(--text);background:rgba(0,0,0,.3)}
  .btn.ghost:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35)}
  .btn svg{width:15px;height:15px;fill:currentColor}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
  .chip{padding:6px 12px;border:1px solid var(--line);color:var(--muted);font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
  @media(max-width:900px){.hero{padding:90px 20px 36px;justify-content:flex-start}.hero .in{grid-template-columns:1fr;gap:26px;margin-top:calc(74vw + 10px)}.right{align-items:flex-start;text-align:left}.btns,.chips{justify-content:flex-start}.orbwrap{top:calc(90px + 37vw)}canvas#orb{top:calc(90px + 37vw);width:min(100vw,70svh);height:min(100vw,70svh)}.bio{max-width:none}.avatar{width:80px;height:80px}}

  /* sections */
  section.block{max-width:1120px;margin:0 auto;padding:60px 20px}
  .sh{text-align:center;margin-bottom:38px}
  .sh .eyebrow{margin-bottom:14px;justify-content:center}
  .sh h2{margin:0;font-size:clamp(30px,5vw,46px);letter-spacing:-.03em;font-weight:800}
  .sh p{margin:10px auto 0;max-width:520px;color:var(--muted);font-size:16px}
  .rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
  .rv.on{opacity:1;transform:none}

  /* server cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .srv{display:block;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}
  .srv:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .srv .top{aspect-ratio:16/7;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));background-size:cover;background-position:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .srv:hover .top{transform:scale(1.04)}
  .srv .shade{position:absolute;left:0;right:0;top:0;aspect-ratio:16/7;background:linear-gradient(180deg,transparent 40%,var(--surface) 100%);pointer-events:none}
  .srv .join{position:absolute;top:12px;right:12px;padding:5px 11px;border-radius:999px;background:rgba(9,9,12,.7);border:1px solid var(--line2);backdrop-filter:blur(8px);font-size:12px;font-weight:700;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
  .srv:hover .join{opacity:1;transform:none}
  .srv .body{padding:0 18px 18px;position:relative}
  .srv .head{display:flex;gap:14px;align-items:flex-start}
  .srv .head .txt{min-width:0;flex:1;padding-top:10px}
  .srv img.ic,.srv .ph{width:60px;height:60px;margin-top:-30px;border-radius:18px;object-fit:cover;background:var(--bg);border:3px solid var(--surface);flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .srv .name{font-weight:700;font-size:17px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srv .name svg{width:15px;height:15px;fill:var(--accent);vertical-align:-2px;margin-left:4px}
  .srv .role{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);font-size:12px;font-weight:600}
  .srv .role.owner{background:var(--accent);color:var(--bg);border-color:transparent}
  .srv .stats{display:flex;gap:16px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  .srv .stats b{color:var(--text);font-weight:700;font-size:14px}
  .srv .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#23a55a;margin-right:6px;box-shadow:0 0 8px #23a55a;vertical-align:1px}
  .since{margin-left:auto}.srv.err .stats{color:#f0b232}

  /* socials */
  .socs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .soc{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;transition:transform .2s,border-color .2s,background .2s}
  .soc:hover{transform:translateY(-3px);border-color:var(--line2);background:color-mix(in srgb,var(--surface) 70%,rgba(255,255,255,.06))}
  .soc svg{width:20px;height:20px;fill:var(--text);flex-shrink:0}
  .soc>span{min-width:0}.soc small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .soc .arr{margin-left:auto;color:var(--muted)}

  footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 20px;color:var(--muted);font-size:13px;text-align:center}
  .skel{color:transparent;background:rgba(255,255,255,.08);border-radius:6px;animation:sk 1.2s infinite}
  @keyframes sk{50%{opacity:.5}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hero .in{animation:none}}
  /* --- animation layer --- */
  nav{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .35s}
  .avwrap:before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60%,var(--accent) 80%,transparent 100%);animation:spin 5s linear infinite;opacity:.9;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  .status.online:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #23a55a;animation:ping 2s infinite;opacity:0}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .eyebrow i{animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.35}}
  h1 .ch{display:inline-block;white-space:pre;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--text) 55%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .ch:hover{animation:jelly .6s}
  @keyframes jelly{30%{transform:scaleY(1.2) translateY(-6px)}60%{transform:scaleY(.9)}}
  .hero .in{animation:none}
  .js .a-in{opacity:0}
  .tilt{transform-style:preserve-3d;will-change:transform}
  .tilt .sheen{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.12),transparent 45%);opacity:0;transition:opacity .25s}
  .tilt:hover .sheen{opacity:1}
  .srv:hover,.soc:hover{transform:none}
  .btn,nav a.cta{will-change:transform}
  .btn.pri{position:relative;overflow:hidden}
  .btn.pri:after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s 1.5s infinite}
  @keyframes shine{0%{left:-80%}25%,100%{left:140%}}
  .sh h2 .w{display:inline-block}
  .cursor{position:fixed;z-index:30;left:0;top:0;width:34px;height:34px;border:1.5px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s,border-color .25s;mix-blend-mode:difference}
  .cursor.big{width:64px;height:64px;background:rgba(255,255,255,.9);border-color:transparent}
  @media(hover:none){.cursor{display:none}}
  @media(prefers-reduced-motion:reduce){.js .a-in{opacity:1}.avwrap:before,.avatar,.btn.pri:after{animation:none!important}.cursor{display:none}}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div id="loader"><div class="in"><div class="t" id="ldtxt">Loading</div><div class="bar"><i></i></div></div></div>
<canvas id="fx"></canvas>
<nav id="nav"></nav>
<div class="page">
  <header class="hero" id="home"><canvas id="orb"></canvas><div id="profile"></div></header>
  <section class="block" id="servers"></section>
  <section class="block" id="socials"></section>
  <footer id="footer"></footer>
</div>
<script>
document.documentElement.classList.add('js');
// load config.js fresh every time (GitHub Pages caches aggressively)
(function () { const s = document.createElement('script'); s.src = 'config.js?v=' + Date.now(); s.onload = init; s.onerror = () => { document.getElementById('loader').classList.add('hide'); document.getElementById('profile').innerHTML = '<p>config.js is missing — add it next to index.html.</p>'; }; document.head.appendChild(s); })();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  youtube: '<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>',

  instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.2.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 4 2.4 7.2 2.3c1.2-.1 1.6-.1 4.8-.1ZM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0Zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4ZM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9Z"/></svg>',

  const hasServers = !!C.servers?.length, hasSocials = !!C.socials?.length;

  // ---- nav
  document.getElementById('nav').innerHTML = `<a class="brand" href="#home"><img id="navav" src="${esc(defaultAvatar)}" alt=""><span id="navname">${esc(C.name || '')}</span></a><div class="links"><a class="l" href="#home">Home</a>${hasServers ? `<a class="l" href="#servers">${esc(C.navServers || 'Servers')}</a>` : ''}${hasSocials ? `<a class="l" href="#socials">${esc(C.navSocials || 'Socials')}</a>` : ''}</div>${profileLink ? `<a class="cta" href="${esc(profileLink)}" target="_blank" rel="noopener">${ICONS.discord} Discord</a>` : ''}`;

  // ---- hero
  document.getElementById('profile').innerHTML = `
<div class="left">
  <div class="a-in"><span class="eyebrow"><i></i>${esc(C.headline || 'Discord moderator')}</span></div>
  <h1 id="name">${C.name ? esc(C.name) : '<span class="skel">Loading name</span>'}</h1><p class="tag a-in" id="tag">${esc(C.tag || '')}</p>
  ${C.bio ? `<p class="bio a-in">${esc(C.bio)}</p>` : ''}
  <div class="meta a-in">${C.location ? `<span>📍 ${esc(C.location)}</span>` : ''}${C.timezone ? `<span>🕒 <span id="clock"></span></span>` : ''}<span id="activity"></span></div>
</div>
<div class="right">
  ${C.tagline ? `<p class="note a-in">${esc(C.tagline)}</p>` : ''}
  <div class="btns a-in">${profileLink ? `<a class="btn ghost" href="${esc(profileLink)}" target="_blank" rel="noopener">${ICONS.discord} Discord profile</a>` : ''}${hasServers ? `<a class="btn pri" href="#servers">${esc(C.ctaText || 'Explore servers')} <span>›</span></a>` : ''}</div>
  ${C.tags?.length ? `<div class="chips a-in">${C.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
</div>`;
  document.getElementById('profile').classList.add('in');
  document.getElementById('profile').insertAdjacentHTML('beforebegin', `<div class="orbwrap"><div class="avwrap a-in"><img class="avatar" id="avatar" src="${esc(defaultAvatar)}" alt=""><span class="status" id="status" title="status"></span></div></div>`);
  startOrb(T.orb !== false, (T.orbColors && T.orbColors.length === 2) ? T.orbColors : ['#fff3cf', '#e07a2a']);
  if (C.timezone) { const tick = () => { const el = document.getElementById('clock'); if (el) el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: C.timezone }) + ' local'; }; tick(); setInterval(tick, 30_000); }
  const loader = document.getElementById('loader'); let loaded = false;
  const done = () => { if (loaded) return; loaded = true; setTimeout(() => { loader.classList.add('hide'); heroIn(); }, 350); };
  let nameAnimated = false; const animName = () => { if (nameAnimated) return; nameAnimated = true; const h = document.getElementById('name'); if (h.querySelector('.skel')) return; letterIn(h, 250); };
  const setName = (n, t) => { if (!C.name && n) { document.getElementById('name').textContent = n; document.getElementById('navname').textContent = n; document.title = `${n} — portfolio`; } if (!C.tag && t) document.getElementById('tag').textContent = t; document.getElementById('ldtxt').textContent = 'Loading ' + (C.name || n || ''); done(); };
  const heroIn = () => { animName(); rise(document.querySelectorAll('.hero .a-in'), { delay: 150, stagger: 110 }); };
  const setAvatar = (u) => { if (!C.avatar && u) { document.getElementById('avatar').src = u; document.getElementById('navav').src = u; } setIcon(C.avatar || u); };
  const setIcon = (u) => { if (!u) return; document.getElementById('ogi').content = u; let l = document.querySelector('link[rel=icon]'); if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.href = u; };
  document.getElementById('ogt').content = (C.name ? C.name + ' — ' : '') + (C.headline || 'Discord moderator'); document.getElementById('ogd').content = C.bio || document.getElementById('ogd').content; if (C.avatar) setIcon(C.avatar);
  const setAccent = (color) => { if (T.preset === 'auto' && color) root.setProperty('--accent', color); };
  if (C.name) { document.title = `${C.name} — portfolio`; document.getElementById('ldtxt').textContent = 'Loading ' + C.name; }

  // 1) public profile lookup (no setup needed): name, avatar
  if (userId) {
    fetch(`https://discordlookup.mesalytic.moe/v1/user/${userId}`).then((r) => r.ok ? r.json() : null).then((u) => {
      if (!u) return;
      setName(u.global_name || u.username, u.username ? '@' + u.username : '');
      setAvatar(u.avatar?.link ? u.avatar.link + '?size=256' : null);
      setAccent(u.banner?.color || u.accent_color);
    }).catch(() => {});
    // 2) live presence via Lanyard (only if you've joined discord.gg/lanyard) — status dot, activity, freshest avatar
    fetch(`https://api.lanyard.rest/v1/users/${userId}`).then((r) => r.json()).then((j) => {
      if (!j?.success) return;
      const d = j.data; const st = document.getElementById('status'); st.className = 'status ' + (d.discord_status || 'offline'); st.title = d.discord_status;
      setName(d.discord_user?.global_name || d.discord_user?.username, d.discord_user?.username ? '@' + d.discord_user.username : '');
      if (d.discord_user?.avatar) setAvatar(`https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.${d.discord_user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`);
      const act = (d.activities || []).find((a) => a.type !== 4), custom = (d.activities || []).find((a) => a.type === 4);
      const el = document.getElementById('activity');
      if (d.listening_to_spotify && d.spotify) el.textContent = `🎵 ${d.spotify.song} — ${d.spotify.artist}`; else if (act) el.textContent = `🎮 ${act.name}`; else if (custom?.state) el.textContent = `💬 ${custom.state}`;
    }).catch(() => {});
  } else setName(C.name || 'Your name', C.tag);
  setTimeout(() => { const n = document.getElementById('name'); if (n.querySelector('.skel')) n.textContent = C.name || 'Discord user'; done(); }, 2500);
  if (!RM()) { const ld = document.getElementById('ldtxt'); ld.animate([{ opacity: .3 }, { opacity: 1 }, { opacity: .3 }], { duration: 1600, iterations: Infinity }); }

  // ---- servers ("showcase")
  const sv = document.getElementById('servers');
  if (hasServers) {
    sv.innerHTML = `<div class="sh rv"><span class="eyebrow">${esc(C.serversEyebrow || 'Showcase')}</span><h2>${esc(C.serversTitle || 'Servers')}</h2><p>${esc(C.serversIntro || '')}</p></div><div class="grid">${C.servers.map((s, i) => `<a class="srv rv" style="transition-delay:${i * 60}ms" id="srv${i}" href="https://discord.gg/${esc(s.invite)}" target="_blank" rel="noopener"><div class="top"></div><div class="shade"></div><span class="join">Join ↗</span><div class="body"><div class="head">${s.icon ? `<img class="ic" loading="lazy" decoding="async" src="${esc(s.icon)}" alt="">` : `<div class="ph">${esc((s.name || s.invite || '?')[0].toUpperCase())}</div>`}<div class="txt"><div class="name">${s.name ? esc(s.name) : '<span class="skel">Loading name…</span>'}</div><span class="role ${/owner|founder/i.test(s.role || '') ? 'owner' : ''}">${esc(s.role || 'Staff')}</span></div></div><div class="stats"><span><span class="dot"></span><b class="on"><span class="skel">0000</span></b> online</span><span><b class="mem"><span class="skel">00000</span></b> members</span>${s.since ? `<span class="since">since ${esc(s.since)}</span>` : ''}</div></div></a>`).join('')}</div>`;
    C.servers.forEach(async (s, i) => {
      const card = document.getElementById('srv' + i);
      try {
        const r = await fetch(`https://discord.com/api/v10/invites/${encodeURIComponent(s.invite)}?with_counts=true&with_expiration=true`);
        if (!r.ok) throw new Error(r.status === 404 ? 'invite not found or expired' : 'Discord returned ' + r.status);
        const j = await r.json(); const g = j.guild || {};
        const nameEl = card.querySelector('.name');
        if (!s.name) { nameEl.textContent = g.name || s.invite; const ph = card.querySelector('.ph'); if (ph && g.name) ph.textContent = g.name[0].toUpperCase(); }
        if ((g.features || []).includes('VERIFIED') || (g.features || []).includes('PARTNERED')) nameEl.insertAdjacentHTML('beforeend', ICONS.verified);
        if (!s.icon && g.icon) { const img = document.createElement('img'); img.className = 'ic'; img.loading = 'lazy'; img.decoding = 'async'; img.src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${g.icon.startsWith('a_') ? 'gif' : 'png'}?size=128`; img.alt = ''; card.querySelector('.ph')?.replaceWith(img); }
        const art = g.banner ? `https://cdn.discordapp.com/banners/${g.id}/${g.banner}.png?size=600` : g.splash ? `https://cdn.discordapp.com/splashes/${g.id}/${g.splash}.png?size=600` : null;
        if (art) card.querySelector('.top').style.backgroundImage = `url('${art}')`;
        countUp(card.querySelector('.on'), j.approximate_presence_count || 0); countUp(card.querySelector('.mem'), j.approximate_member_count || 0);
      } catch (e) {
        card.classList.add('err'); if (!s.name) card.querySelector('.name').textContent = s.invite;
        card.querySelector('.stats').innerHTML = `<span>Live stats unavailable — ${esc(e.message)}</span>`;
      }
    });
  } else sv.remove();

  // ---- socials
  const so = document.getElementById('socials');
  if (hasSocials) so.innerHTML = `<div class="sh rv"><span class="eyebrow">${esc(C.socialsEyebrow || 'More')}</span><h2>${esc(C.socialsTitle || 'Find me elsewhere')}</h2></div><div class="socs">${C.socials.map((s, i) => { const url = s.url || (s.icon === 'discord' ? profileLink : '#'); return `<a class="soc rv" style="transition-delay:${i * 50}ms" href="${esc(url)}" target="_blank" rel="noopener">${ICONS[s.icon] || ICONS.website}<span>${esc(s.label || s.icon)}<small>${esc(s.handle || url.replace(/^(https?:\/\/|mailto:)/, '').replace(/\/$/, ''))}</small></span><span class="arr">↗</span></a>`; }).join('')}</div>`; else so.remove();

  document.getElementById('footer').textContent = C.footer || '';
  // reveal on scroll
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) return; const el = e.target; io.unobserve(el); el.classList.add('on'); el.style.transition = 'none'; el.style.transitionDelay = '';
    if (el.classList.contains('sh')) { const h2 = el.querySelector('h2'); rise(el.querySelectorAll('.eyebrow, p'), { stagger: 120 }); const ws = splitWords(h2); if (!RM()) ws.forEach((w, i) => w.animate([{ opacity: 0, transform: 'translateY(40px) skewY(4deg)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 900, delay: 120 + i * 90, easing: EASE, fill: 'backwards' })); }
    else { const sib = [...el.parentElement.children]; rise([el], { delay: Math.min(sib.indexOf(el) % 3, 2) * 90, y: 40, dur: 900 }); } }), { threshold: .15 });
  document.querySelectorAll('.rv').forEach((el) => io.observe(el));
  document.querySelectorAll('.srv').forEach((el) => tilt(el, 9)); document.querySelectorAll('.soc').forEach((el) => tilt(el, 12));
  document.querySelectorAll('.btn, nav a.cta').forEach((el) => magnetic(el));
  cursorFx(); navFx(); heroParallax();
}
</script>
</body>
</html>
