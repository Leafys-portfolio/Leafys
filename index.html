<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="The Discord servers I help run, live, and where to find me.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
  :root{--accent:#8b7bff;--accent2:#ffb86b;--bg:#0e0b1e;--surface:#17132d;--text:#efeafd;--muted:#9d96bd;--r:24px;--font:'Outfit';--online:#3ddc84;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font),system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body.pattern{background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:26px 26px}
  body.glow:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(760px 420px at 50% -8%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);z-index:0}
  a{color:inherit;text-decoration:none}
  .wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:40px 16px 72px}
  @media(max-width:520px){.wrap{padding:14px 12px 56px}}

  .profile{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--accent) 55%,transparent);opacity:0;transform:translateY(10px);animation:in .5s .05s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .banner{height:180px;background:linear-gradient(115deg,var(--accent),color-mix(in srgb,var(--accent) 35%,var(--accent2)) 60%,var(--accent2));background-size:cover;background-position:center;position:relative}
  .banner:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--surface) 70%,transparent),transparent 55%)}
  .pbody{padding:0 28px 26px;position:relative}
  @media(max-width:520px){.pbody{padding:0 18px 20px}.banner{height:140px}}
  .toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .avwrap{position:relative;width:128px;margin-top:-64px}
  .avatar{width:128px;height:128px;border-radius:50%;border:6px solid var(--surface);background:var(--surface);object-fit:cover;display:block;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .status{position:absolute;right:6px;bottom:8px;width:28px;height:28px;border-radius:50%;border:5px solid var(--surface);background:#80848e}
  .status.online{background:var(--online)}.status.idle{background:#f0b232}.status.dnd{background:#f23f43}
  .cta{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;padding:12px 20px;border-radius:calc(var(--r) - 8px);font-weight:600;margin-bottom:6px;transition:transform .15s,filter .15s;white-space:nowrap;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
  .cta:hover{filter:brightness(1.1);transform:translateY(-1px)}.cta svg{width:18px;height:18px;fill:currentColor}
  h1{font-size:36px;line-height:1.1;margin:14px 0 2px;font-weight:800;letter-spacing:-.7px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{color:var(--muted);font-weight:500;margin:0}
  .bio{margin:14px 0 0;max-width:62ch;font-size:17px}
  .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:12px;min-height:22px}
  .meta span{display:inline-flex;align-items:center;gap:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .chip{padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:13.5px;font-weight:500}
  .socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .soc{display:inline-flex;align-items:center;gap:9px;padding:9px 14px 9px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:500;font-size:14.5px;transition:background .15s,border-color .15s}
  .soc:hover{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
  .soc svg{width:20px;height:20px;fill:currentColor}

  h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:44px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .srv{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:border-color .15s,transform .15s}
  .srv:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);transform:translateY(-2px)}
  .srv .top{height:64px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 45%,var(--surface)),var(--surface));background-size:cover;background-position:center}
  .srv .body{padding:0 18px 16px}
  .srv .head{display:flex;gap:14px;align-items:flex-start}
  .srv .head .txt{min-width:0;padding-top:8px;flex:1}
  .srv img,.srv .ph{width:62px;height:62px;margin-top:-28px;border-radius:20px;object-fit:cover;background:color-mix(in srgb,var(--accent) 35%,var(--surface));border:4px solid var(--surface);flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:22px}
  .srv .name{font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srv .name svg{vertical-align:-2px;margin-left:4px}
  .srv .name svg{width:16px;height:16px;fill:var(--accent)}
  .srv .role{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2);font-size:12.5px;font-weight:700}
  .srv .role.owner{background:color-mix(in srgb,var(--accent) 22%,transparent);color:color-mix(in srgb,var(--accent) 70%,#fff)}
  .stats{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);align-items:center;flex-wrap:wrap}
  .stats b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--online);margin-right:7px;box-shadow:0 0 0 0 rgba(61,220,132,.5);animation:pulse 2.2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  .since{margin-left:auto}.srv.err .stats{color:var(--accent2)}
  .join{position:absolute;top:14px;right:14px;font-size:12.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .15s}
  .srv:hover .join{opacity:1}
  footer{margin-top:56px;color:var(--muted);font-size:13.5px;text-align:center}
  .skel{color:transparent;background:rgba(255,255,255,.08);border-radius:6px;animation:sk 1.2s infinite}
  @keyframes sk{50%{opacity:.5}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.profile{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="profile" id="profile"></section>
  <section id="servers"></section>
  <footer id="footer"></footer>
</div>

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n));

const idFrom = (link) => (String(link || '').match(/(\d{15,22})/) || [])[1] || '';

function init() {
  const C = window.PORTFOLIO || {}; const T = C.theme || {};
  const userId = idFrom(C.profileLink);
  const profileLink = C.profileLink || (userId ? `https://discord.com/users/${userId}` : '');
  // ---- theme
  const root = document.documentElement.style;
  const preset = PRESETS[T.preset] || PRESETS.violet;
  const [pa, pa2, pbg, psf] = preset;

  if (T.text) root.setProperty('--text', T.text); if (T.muted) root.setProperty('--muted', T.muted);

  if (T.font) { root.setProperty('--font', `'${T.font}'`); const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(T.font)}:wght@400;500;600;700;800&display=swap`; document.head.appendChild(l); }
  if (T.pattern !== false) document.body.classList.add('pattern'); if (T.glow !== false) document.body.classList.add('glow');

  // ---- profile card (renders instantly with what we know, then fills in from Discord)
  const prof = document.getElementById('profile');
  prof.innerHTML = `<div class="banner" id="banner" ${C.banner ? `style="background-image:url('${esc(C.banner)}')"` : ''}></div><div class="pbody">
<div class="toprow"><div class="avwrap"><img class="avatar" id="avatar" src="${esc(C.avatar || `https://cdn.discordapp.com/embed/avatars/${userId ? Number(BigInt(userId) >> 22n) % 6 : 0}.png`)}" alt=""><span class="status" id="status" title="status"></span></div>${profileLink ? `<a class="cta" href="${esc(profileLink)}" target="_blank" rel="noopener">${ICONS.discord} Discord profile</a>` : ''}</div>
<h1 id="name">${C.name ? esc(C.name) : '<span class="skel">Loading name</span>'}</h1><p class="tag" id="tag">${esc(C.tag || '')}</p>
${C.bio ? `<p class="bio">${esc(C.bio)}</p>` : ''}
<div class="meta">${C.location ? `<span>📍 ${esc(C.location)}</span>` : ''}${C.timezone ? `<span>🕒 <span id="clock"></span></span>` : ''}<span id="activity"></span></div>
${C.tags?.length ? `<div class="chips">${C.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
${C.socials?.length ? `<div class="socials">${C.socials.map((s) => `<a class="soc" href="${esc(s.url || (s.icon === 'discord' ? profileLink : '#'))}" target="_blank" rel="noopener">${ICONS[s.icon] || ICONS.website}${esc(s.label || s.icon)}</a>`).join('')}</div>` : ''}
</div>`;
  if (C.timezone) { const tick = () => { const el = document.getElementById('clock'); if (el) el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: C.timezone }) + ' local'; }; tick(); setInterval(tick, 30_000); }
  const setName = (n, t) => { if (!C.name && n) { document.getElementById('name').textContent = n; document.title = `${n} — portfolio`; } if (!C.tag && t) document.getElementById('tag').textContent = t; };
  const setAvatar = (u) => { if (!C.avatar && u) document.getElementById('avatar').src = u; };
  const setBanner = (u, color) => { const b = document.getElementById('banner'); if (C.banner) return; if (u) b.style.backgroundImage = `url('${u}')`; if (T.preset === 'auto' && color) { root.setProperty('--accent', color); } };

  // 1) public profile lookup (no setup needed): name, avatar, banner
  if (userId) {
    fetch(`https://discordlookup.mesalytic.moe/v1/user/${userId}`).then((r) => r.ok ? r.json() : null).then((u) => {
      if (!u) return;
      setName(u.global_name || u.username, u.username ? '@' + u.username : '');
      setAvatar(u.avatar?.link ? u.avatar.link + '?size=256' : null);
      setBanner(u.banner?.link ? u.banner.link + '?size=1024' : null, u.banner?.color || u.accent_color);
    }).catch(() => {});
    // 2) live presence via Lanyard (only if you've joined discord.gg/lanyard) — status dot, activity, freshest avatar
    fetch(`https://api.lanyard.rest/v1/users/${userId}`).then((r) => r.json()).then((j) => {
      if (!j?.success) return;
      const d = j.data; const st = document.getElementById('status'); st.className = 'status ' + (d.discord_status || 'offline'); st.title = d.discord_status;
      setName(d.discord_user?.global_name || d.discord_user?.username, d.discord_user?.username ? '@' + d.discord_user.username : '');
      if (d.discord_user?.avatar) setAvatar(`https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.${d.discord_user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`);
      const act = (d.activities || []).find((a) => a.type !== 4), custom = (d.activities || []).find((a) => a.type === 4);
      const el = document.getElementById('activity');
      if (d.listening_to_spotify && d.spotify) el.textContent = `🎵 ${d.spotify.song} — ${d.spotify.artist}`; else if (act) el.textContent = `🎮 ${act.name}`; else if (custom?.state) el.textContent = `💬 ${custom.state}`;
    }).catch(() => {});
  } else setName(C.name || 'Your name', C.tag);
  setTimeout(() => { const n = document.getElementById('name'); if (n.querySelector('.skel')) n.textContent = C.name || 'Discord user'; }, 6000);

  // ---- servers
  const sv = document.getElementById('servers');
  if (C.servers?.length) {
    sv.innerHTML = `<h2>${esc(C.serversTitle || 'Servers')}</h2><p class="sub">${esc(C.serversIntro || '')}</p><div class="grid">${C.servers.map((s, i) => `<a class="srv" id="srv${i}" href="https://discord.gg/${esc(s.invite)}" target="_blank" rel="noopener"><div class="top"></div><span class="join">Join ↗</span><div class="body"><div class="head">${s.icon ? `<img src="${esc(s.icon)}" alt="">` : `<div class="ph">${esc((s.name || s.invite || '?')[0].toUpperCase())}</div>`}<div class="txt"><div class="name">${s.name ? esc(s.name) : '<span class="skel">Loading name…</span>'}</div><span class="role ${/owner|founder/i.test(s.role || '') ? 'owner' : ''}">${esc(s.role || 'Staff')}</span></div></div><div class="stats"><span><span class="dot"></span><b class="on"><span class="skel">0000</span></b> online</span><span><b class="mem"><span class="skel">00000</span></b> members</span>${s.since ? `<span class="since">since ${esc(s.since)}</span>` : ''}</div></div></a>`).join('')}</div>`;
    C.servers.forEach(async (s, i) => {
      const card = document.getElementById('srv' + i);
      try {
        const r = await fetch(`https://discord.com/api/v10/invites/${encodeURIComponent(s.invite)}?with_counts=true&with_expiration=true`);
        if (!r.ok) throw new Error(r.status === 404 ? 'invite not found or expired' : 'Discord returned ' + r.status);
        const j = await r.json(); const g = j.guild || {};
        const nameEl = card.querySelector('.name');
        if (!s.name) nameEl.textContent = g.name || s.invite;
        if ((g.features || []).includes('VERIFIED') || (g.features || []).includes('PARTNERED')) nameEl.insertAdjacentHTML('beforeend', ICONS.verified);
        if (!s.icon && g.icon) { const img = document.createElement('img'); img.src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${g.icon.startsWith('a_') ? 'gif' : 'png'}?size=128`; img.alt = ''; card.querySelector('.ph')?.replaceWith(img); }
        const art = g.banner ? `https://cdn.discordapp.com/banners/${g.id}/${g.banner}.png?size=600` : g.splash ? `https://cdn.discordapp.com/splashes/${g.id}/${g.splash}.png?size=600` : null;
        if (art) card.querySelector('.top').style.backgroundImage = `url('${art}')`;
        countUp(card.querySelector('.on'), j.approximate_presence_count || 0); countUp(card.querySelector('.mem'), j.approximate_member_count || 0);
      } catch (e) {
        card.classList.add('err'); if (!s.name) card.querySelector('.name').textContent = s.invite;
        card.querySelector('.stats').innerHTML = `<span>Live stats unavailable — ${esc(e.message)}</span>`;
      }
    });
  }
  document.getElementById('footer').textContent = C.footer || '';
}
</script>
</body>
</html>
