<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="theme-color" content="#07070d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta property="og:type" content="profile"><meta property="og:title" id="ogt" content="Discord portfolio"><meta property="og:description" id="ogd" content="Servers, roles and live member counts."><meta property="og:image" id="ogi" content="">
<meta name="description" id="desc" content="Discord moderator portfolio.">
<link rel="icon" id="fav" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23fff'/></svg>">
<style>
  :root{--bg:#07070d;--text:#fff;--muted:#a5a5b8;--accent:#fff;--accent-text:#000;--g-op:.06;--g-blur:24px;--g-border:rgba(255,255,255,.14);--g-r:28px;--g-tr:22px;--btn-r:999px;--chip-r:999px;--font:'Inter';--name-size:54px;--name-weight:800;--max:1240px;--on:#23a55a;--idle:#f0b232;--dnd:#f23f43;--off:#5b5b66;--g-shadow:0 30px 80px rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font),Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
  a{color:inherit;text-decoration:none}
  #blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(var(--blob-blur,90px));transform:translate(-50%,-50%);will-change:transform}
  .drift .blob{animation:drift 18s ease-in-out infinite alternate}
  .drift .blob:nth-child(2){animation-duration:23s;animation-delay:-6s}.drift .blob:nth-child(3){animation-duration:27s;animation-delay:-12s}
  @keyframes drift{from{transform:translate(-50%,-50%) translate(0,0) scale(1)}to{transform:translate(-50%,-50%) translate(60px,-40px) scale(1.12)}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  canvas#orb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,100svh);height:min(100vw,100svh);pointer-events:none;z-index:0;opacity:.6}
  .page{position:relative;z-index:1}
  .glass{background:rgba(255,255,255,var(--g-op));border:1px solid var(--g-border);backdrop-filter:blur(var(--g-blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.3);border-radius:var(--g-r);box-shadow:var(--g-shadow);position:relative}
  .glass.tile{border-radius:var(--g-tr)}
  #loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
  #loader.hide{opacity:0;visibility:hidden}
  #loader .t{font-weight:600;font-size:15px;color:var(--muted);text-align:center}
  #loader .bar{width:160px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;margin:14px auto 0;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:ld 1s infinite ease-in-out}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  nav{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  nav.hide{transform:translateY(-130%)}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
  nav .brand img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.1)}
  nav .pill{display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  nav .pill a{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:color .15s,background .15s}
  nav .pill a:hover{color:var(--text)}nav .pill a.on{background:var(--accent);color:var(--accent-text)}
  nav .cta{justify-self:end;padding:10px 18px;border-radius:var(--btn-r);background:var(--accent);color:var(--accent-text);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  nav .cta svg{width:14px;height:14px;fill:currentColor}
  @media(max-width:760px){nav{grid-template-columns:1fr auto;padding:14px 16px}nav .pill{display:none}nav .brand{font-size:16px}}
  .hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:110px 32px 60px}
  .hero .in{position:relative;z-index:1;width:100%;max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:28px;align-items:center}
  .hero.center .in{grid-template-columns:minmax(0,560px);justify-content:center;text-align:center}
  .hero.center .card{align-items:center}.hero.center .row{justify-content:center}
  .card{padding:34px;display:flex;flex-direction:column;align-items:flex-start}
  .avwrap{position:relative;display:inline-block;margin-bottom:6px}
  .avatar{width:var(--av,96px);height:var(--av,96px);border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:block}
  .ring .avwrap:before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60%,var(--accent) 80%,transparent 100%);animation:spin 5s linear infinite;opacity:.9;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .float .avatar{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .status{position:absolute;right:2px;bottom:2px;width:20px;height:20px;border-radius:50%;background:var(--off);border:4px solid var(--bg)}
  .status.online{background:var(--on)}.status.idle{background:var(--idle)}.status.dnd{background:var(--dnd)}
  .pulse .status.online:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--on);animation:ping 2s infinite;opacity:0}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:18px}
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--on);box-shadow:0 0 10px var(--on)}
  h1{margin:10px 0 6px;font-size:var(--name-size);font-weight:var(--name-weight);letter-spacing:-.04em;line-height:1;overflow-wrap:anywhere}
  h1 .ch{display:inline-block;white-space:pre}
  .tag{color:var(--muted);font-size:15px;display:flex;gap:12px;flex-wrap:wrap}
  .bio{color:color-mix(in srgb,var(--text) 82%,var(--muted));font-size:17px;line-height:1.5;margin:18px 0 0;max-width:420px}
  .row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:var(--chip-r);background:rgba(255,255,255,.08);font-size:13px;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:var(--btn-r);font-weight:700;font-size:14.5px;transition:transform .15s,filter .15s,background .15s;position:relative;overflow:hidden}
  .btn.solid{background:var(--accent);color:var(--accent-text)}.btn.solid:hover{filter:brightness(1.08)}
  .btn.glass{background:rgba(255,255,255,.1);color:var(--text);border:1px solid rgba(255,255,255,.2)}.btn.glass:hover{background:rgba(255,255,255,.16)}
  .btn svg{width:15px;height:15px;fill:currentColor}
  .shine .btn.solid:after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 4s 1.5s infinite}
  @keyframes shine{0%{left:-80%}25%,100%{left:140%}}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{padding:18px;display:flex;gap:14px;align-items:center;min-width:0;transition:transform .25s,border-color .25s}
  .tile:hover{border-color:rgba(255,255,255,.3)}
  .tile .ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;object-fit:cover;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:800;font-size:18px}
  .tile .nm{min-width:0}.tile b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{color:var(--muted);font-size:12.5px}
  .tile .st{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.35;flex-shrink:0}.tile .st b{font-size:15px;display:inline}
  .tile.stat{justify-content:center;color:var(--muted);font-weight:700;font-size:15px;text-align:center}
  .tile.big{flex-direction:column;align-items:flex-start;gap:4px}.tile.big .n{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}.tile.big small{letter-spacing:.1em;text-transform:uppercase;font-size:11px;font-weight:700}
  section.block{max-width:var(--max);margin:0 auto;padding:50px 32px}
  .sh{text-align:center;margin-bottom:34px}.sh .eyebrow{margin:0 0 12px;justify-content:center}
  .sh h2{margin:0;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;font-weight:800}.sh p{margin:10px auto 0;max-width:560px;color:var(--muted);font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:16px}
  .srv{display:block;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s}
  .srv:hover{border-color:rgba(255,255,255,.3)}
  .srv .top{aspect-ratio:16/7;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02));background-size:cover;background-position:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .srv:hover .top{transform:scale(1.04)}
  .srv .join{position:absolute;top:12px;right:12px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);font-size:12px;font-weight:700;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
  .srv:hover .join{opacity:1;transform:none}
  .srv .body{padding:0 18px 18px;position:relative}
  .srv .head{display:flex;gap:14px;align-items:flex-start}.srv .head .txt{min-width:0;flex:1;padding-top:10px}
  .srv img.ic,.srv .ph{width:60px;height:60px;margin-top:-30px;border-radius:18px;object-fit:cover;background:var(--bg);border:3px solid rgba(20,20,30,.9);flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:22px}
  .srv .name{font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srv .name svg{width:15px;height:15px;fill:var(--accent);vertical-align:-2px;margin-left:4px}
  .srv .role{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:600}
  .srv .stats{display:flex;gap:16px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);color:var(--muted);font-size:13px}
  .srv .stats b{color:var(--text);font-weight:700;font-size:14px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--on);margin-right:6px;box-shadow:0 0 8px var(--on);vertical-align:1px}
  .since{margin-left:auto}.srv.err .stats{color:var(--idle)}
  .socs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .soc{display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:600;transition:transform .2s,border-color .2s}
  .soc:hover{border-color:rgba(255,255,255,.3)}
  .soc svg{width:20px;height:20px;fill:var(--text);flex-shrink:0}.soc>span{min-width:0}
  .soc small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.soc .arr{margin-left:auto;color:var(--muted)}
  .xs .card{max-width:760px;margin:0 auto}.xs .card p{color:color-mix(in srgb,var(--text) 82%,var(--muted));font-size:16px;line-height:1.6;margin:0 0 14px}.xs .card p:last-child{margin:0}
  .xs ul{margin:0;padding-left:20px;line-height:1.9}.xs .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.xs .cards .tile{flex-direction:column;align-items:flex-start;gap:6px}.xs .cards .tile b{font-size:16px}.xs .cards .tile small{font-size:14px;color:var(--muted)}
  /* bot showcase */
  .botcard{padding:26px;display:flex;flex-direction:column;gap:14px}
  .botcard .bh{display:flex;gap:14px;align-items:center}.botcard .bh img,.botcard .bh .ph{width:56px;height:56px;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:26px;flex-shrink:0}
  .botcard .bh b{font-size:20px;display:block;letter-spacing:-.01em}.botcard .bh small{color:var(--muted)}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}.live i{width:8px;height:8px;border-radius:50%;background:var(--off)}.live.on i{background:var(--on);box-shadow:0 0 8px var(--on)}.live.off i{background:var(--dnd)}
  .botcard .fl{display:flex;flex-wrap:wrap;gap:8px}.botcard .fl span{padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:600}
  .feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .feat{padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.feat .fi{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px}.feat b{font-size:16px}.feat p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
  .access{padding:28px;display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start;margin-top:18px}.access h3{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}.access p{margin:0;color:color-mix(in srgb,var(--text) 82%,var(--muted));line-height:1.55}
  .access ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}.access li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}.access li:before{content:'✓';flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:1px}
  .access .lock{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:700;margin-bottom:12px}
  footer{margin-top:30px;padding:28px 20px;color:var(--muted);font-size:13px;text-align:center}
  .skel{color:transparent;background:rgba(255,255,255,.08);border-radius:6px;animation:sk 1.2s infinite}@keyframes sk{50%{opacity:.5}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .js .a-in{opacity:0}.rv{opacity:0}.rv.on{opacity:1}
  .tilt{transform-style:preserve-3d;will-change:transform}
  .tilt .sheen{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 45%);opacity:0;transition:opacity .25s}
  .tilt:hover .sheen{opacity:1}
  .cursor{position:fixed;z-index:30;left:0;top:0;width:34px;height:34px;border:1.5px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s,border-color .25s;mix-blend-mode:difference}
  .cursor.big{width:64px;height:64px;background:rgba(255,255,255,.9);border-color:transparent}
  @media(hover:none){.cursor{display:none}}
  @media(max-width:900px){.hero{padding:90px 16px 40px}.hero .in{grid-template-columns:1fr;gap:18px}.tiles{grid-template-columns:1fr}.card{padding:26px}section.block{padding:36px 16px}.grid{grid-template-columns:1fr!important}h1{font-size:calc(var(--name-size) * .78)}nav{grid-template-columns:1fr auto}.access{grid-template-columns:1fr}}
  @media(min-width:901px) and (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)!important}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .a-in,.rv{opacity:1}.cursor{display:none}}
</style>
</head>
<body>
<div id="blobs"></div>
<div id="loader"><div><div class="t" id="ldtxt">Loading</div><div class="bar"><i></i></div></div></div>
<nav id="nav"></nav>
<div class="page">
  <header class="hero" id="home"><div class="in" id="profile"></div></header>
  <section class="block" id="bot"></section>
  <section class="block" id="servers"></section>
  <section class="block" id="socials"></section>
  <div id="extra"></div>
  <footer id="footer"></footer>
</div>
<script>
document.documentElement.classList.add('js');
// load config.js fresh every time (GitHub Pages caches aggressively)
(function () { const s = document.createElement('script'); s.src = 'config.js?v=' + Date.now(); s.onload = () => { try { init(); } catch (e) { fail('config.js has a mistake: ' + e.message); } }; s.onerror = () => fail('config.js is missing or has a syntax error — check every line ends with a comma and quotes are closed.'); document.head.appendChild(s); })();
function fail(msg) { document.getElementById('loader').classList.add('hide'); document.getElementById('profile').innerHTML = `<div class="glass card"><b>Portfolio could not load</b><p class="bio">${esc(msg)}</p></div>`; console.error(msg); }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
  discord: '<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a18 18 0 0 1 4.4 2.2 15.6 15.6 0 0 0-15.2 0A18 18 0 0 1 8.8 3.4L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 17.9a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 11.8 0l.5.4a12.9 12.9 0 0 1-2 1l1.3 2.1a19.9 19.9 0 0 0 6-3c.5-5.1-.9-9.5-3.4-13.5ZM8.3 15.2c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Zm7.4 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>',

    }
  });

  // ---- socials
  const so = document.getElementById('socials');
  if (showSocials) so.innerHTML = `<div class="sh rv">${SO.eyebrow ? `<span class="eyebrow">${esc(SO.eyebrow)}</span>` : ''}<h2>${esc(SO.title || 'Socials')}</h2></div><div class="socs">${socials.map((s) => { const url = s.url || (s.icon === 'discord' ? profileLink : '#'); return `<a class="glass tile soc rv" href="${esc(url)}" target="_blank" rel="noopener">${ICONS[s.icon] || ICONS.website}<span>${esc(s.label || s.icon)}<small>${esc(s.handle || url.replace(/^(https?:\/\/|mailto:)/, '').replace(/\/$/, ''))}</small></span><span class="arr">↗</span></a>`; }).join('')}</div>`; else so.remove();

  // ---- extra sections
  const ex = document.getElementById('extra');
  ex.innerHTML = (C.sections || []).filter((x) => x && x.title).map((x, i) => { const id = esc(x.id || 'section' + i); const head = `<div class="sh rv">${x.eyebrow ? `<span class="eyebrow">${esc(x.eyebrow)}</span>` : ''}<h2>${esc(x.title)}</h2></div>`;
    if (x.type === 'cards') return `<section class="block xs" id="${id}">${head}<div class="cards">${(x.cards || []).map((c) => `<div class="glass tile rv"><b>${esc(c.title)}</b><small>${esc(c.text || '')}</small></div>`).join('')}</div></section>`;
    if (x.type === 'list') return `<section class="block xs" id="${id}">${head}<div class="glass card rv"><ul>${(x.items || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div></section>`;
    return `<section class="block xs" id="${id}">${head}<div class="glass card rv">${[].concat(x.body || []).map((t) => `<p>${esc(t)}</p>`).join('')}</div></section>`; }).join('');

  // ---- footer
  const ft = document.getElementById('footer'); if (on(F.show) && F.text) ft.textContent = F.text; else ft.remove();

  // ---- scroll reveal, tilt, magnetic, cursor, nav
  const rvs = document.querySelectorAll('.rv');
  if (anim('scrollReveal')) { const io = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) return; const el = e.target; io.unobserve(el); el.classList.add('on');
      if (el.classList.contains('sh')) { rise(el.querySelectorAll('.eyebrow, p'), { stagger: 120 }); const ws = splitWords(el.querySelector('h2')); ws.forEach((w, i) => w.animate([{ opacity: 0, transform: 'translateY(40px) skewY(4deg)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 900, delay: 120 + i * 90, easing: EASE, fill: 'backwards' })); }
      else { const sib = [...el.parentElement.children]; rise([el], { delay: Math.min(sib.indexOf(el) % 3, 2) * 90, y: 40, dur: 900 }); } }), { threshold: .15 }); rvs.forEach((el) => io.observe(el)); }
  else rvs.forEach((el) => el.classList.add('on'));
  if (anim('tilt')) { document.querySelectorAll('.srv, .soc, .tile, .botcard').forEach((el) => tilt(el, 7)); }
  if (anim('magneticButtons')) document.querySelectorAll('.btn, nav .cta').forEach((el) => magnetic(el));
  if (anim('customCursor')) { document.body.insertAdjacentHTML('afterbegin', '<div class="cursor" id="cursor"></div>'); cursorFx(); }
  if (on(N.hideOnScroll) && on(N.show)) navFx();
}
</script>
</body>
</html>
